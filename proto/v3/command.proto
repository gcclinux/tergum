syntax = "proto3";

package tergum.v3;

option go_package = "github.com/gcclinux/tergum/internal/grpc/proto";

// FileChunk (used by PushRestore) is declared in data.proto within the same
// tergum.v3 package.
import "proto/v3/data.proto";

// CommandService handles control-plane operations on port 7400.
//
// NOTE: The Go in internal/grpc/proto is HAND-MAINTAINED (not generated by
// protoc/buf). This file documents the surface those hand-written files expose;
// do NOT regenerate from it. See internal/grpc/proto/command.go and command_grpc.go.
service CommandService {
  rpc TriggerBackup(BackupRequest) returns (BackupResponse);
  rpc StopBackup(StopRequest) returns (StopResponse);
  rpc GetStatus(StatusRequest) returns (StatusResponse);
  rpc Ping(PingRequest) returns (PingResponse);
  rpc ListBackups(ListBackupsRequest) returns (ListBackupsResponse);
  rpc DeleteFromBackup(DeleteRequest) returns (DeleteResponse);
  rpc GetRetention(RetentionRequest) returns (RetentionResponse);
  rpc StartWatcher(WatcherRequest) returns (WatcherResponse);
  rpc StopWatcher(WatcherRequest) returns (WatcherResponse);
  rpc RegisterClient(RegisterRequest) returns (RegisterResponse);
  rpc ListRecoverableClients(ListRecoverableClientsRequest) returns (ListRecoverableClientsResponse);
  rpc RebindClient(RebindClientRequest) returns (RebindClientResponse);
  // RestoreToTarget restores files from a source client's backup to a target
  // client. Reserved for the server and admin-capable clients.
  rpc RestoreToTarget(RestoreToTargetRequest) returns (RestoreToTargetResponse);
  // ControlClientWatcher starts or stops the file watcher on a target client.
  // Reserved for the server and admin-capable clients.
  rpc ControlClientWatcher(ControlWatcherRequest) returns (WatcherResponse);
  // ListClients returns the server's registered-client list. Admin/server-only,
  // read-only: lets an admin client view the registry remotely.
  rpc ListClients(ListClientsRequest) returns (ListClientsResponse);
  // GetClientStatus returns detailed status for one registered client.
  // Admin/server-only, read-only.
  rpc GetClientStatus(GetClientStatusRequest) returns (ClientStatusResponse);
  rpc PushRestore(stream FileChunk) returns (PushRestoreResponse);
  rpc CommandTunnel(stream TunnelResponse) returns (stream TunnelCommand);
}

enum BackupLevel {
  AUTO = 0;
  FULL = 1;
  ONGOING = 2;
}

message BackupRequest {
  BackupLevel level = 1;
  string client_id = 2;
  string initiated_by = 3;
}

message BackupResponse {
  string backup_id = 1;
  string status = 2;
  string message = 3;
}

message StopRequest {
  string backup_id = 1;
  string client_id = 2;
}

message StopResponse {
  bool success = 1;
  string message = 2;
}

message StatusRequest {
  string client_id = 1;
}

message StatusResponse {
  string status = 1;
  string backup_id = 2;
  int64 files_processed = 3;
  int64 bytes_transferred = 4;
  string started_at = 5;
  string message = 6;
  bool watcher_active = 7;
}

message PingRequest {
  bool watcher_active = 1;
  string last_backup_at = 2;
  bool backup_active = 3;
}

message PingResponse {
  string version = 1;
  string uptime = 2;
  string commit = 3;
  string build_date = 4;
  bool client_disabled = 5;
}

message ListBackupsRequest {
  string client_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message BackupJobInfo {
  string backup_id = 1;
  string level = 2;
  string client_id = 3;
  string initiated_by = 4;
  string started_at = 5;
  string finished_at = 6;
  string status = 7;
  int64 file_count = 8;
  int64 bytes_total = 9;
  int64 bytes_new = 10;
  int64 files_deduped = 11;
  string error_message = 12;
}

message ListBackupsResponse {
  repeated BackupJobInfo backups = 1;
  int32 total = 2;
}

message DeleteRequest {
  string backup_id = 1;
  string file_path = 2;
  string folder_path = 3;
  bool all_backups = 4;
  bool dry_run = 5;
}

message DeleteResponse {
  bool success = 1;
  int64 entries_deleted = 2;
  int64 bytes_freed = 3;
  string message = 4;
}

message RetentionRequest {
  string client_id = 1;
}

message RetentionPolicy {
  string name = 1;
  int32 keep_days = 2;
  int32 keep_versions = 3;
  string pattern = 4;
  int32 priority = 5;
  bool enabled = 6;
}

message RetentionResponse {
  repeated RetentionPolicy policies = 1;
}

// WatcherRequest starts or stops the file watcher on a client node.
message WatcherRequest {
  string client_id = 1;
}

message WatcherResponse {
  bool success = 1;
  string message = 2;
}

// RegisterRequest is sent by a client to register itself with the server.
message RegisterRequest {
  string client_id = 1;
  string address = 2;
  string os_family = 3;
  string machine_id = 4;
  string hostname = 5;
}

message RegisterResponse {
  bool success = 1;
  string server_version = 2;
}

message RecoverableClientInfo {
  string client_id = 1;
  string hostname = 2;
  string os_family = 3;
  string machine_id = 4;
  string status = 5;
  string last_backup = 6;
  string last_seen = 7;
  int64 file_count = 8;
  int64 bytes_total = 9;
  string registered_at = 10;
  bool has_database = 11;
}

message ListRecoverableClientsRequest {}

message ListRecoverableClientsResponse {
  repeated RecoverableClientInfo clients = 1;
}

// RebindClientRequest transfers/re-binds client ownership to a rebuilt machine.
message RebindClientRequest {
  string client_id = 1;
  string address = 2;
  string os_family = 3;
  string machine_id = 4;
  string hostname = 5;
  bool force = 6;
}

message RebindClientResponse {
  bool success = 1;
  string message = 2;
}

// RestoreToTargetRequest restores files from a source client's backup to a
// target client (cross-client restore, admin/server only).
message RestoreToTargetRequest {
  string source_client_id = 1;
  string target_client_id = 2;
  string query = 3;
  string backup_id = 4;
  string file = 5;
  string dest = 6;
}

message RestoreToTargetResponse {
  bool success = 1;
  int64 files_sent = 2;
  int64 files_received = 3;
  int64 files_failed = 4;
  string message = 5;
}

// ControlWatcherRequest starts or stops the file watcher on a target client
// (admin/server only). ControlClientWatcher replies with WatcherResponse.
message ControlWatcherRequest {
  string target_client_id = 1;
  bool start = 2;
}

// ListClientsRequest asks for the registered-client list (admin/server only,
// read-only).
message ListClientsRequest {}

// ClientSummary is one row of the registered-client list. Timestamp fields are
// RFC3339 strings (UTC) or empty when unset; last_backup is resolved
// server-side.
message ClientSummary {
  string client_id = 1;
  string address = 2;
  string os_family = 3;
  string hostname = 4;
  string machine_id = 5;
  string status = 6;
  string last_seen = 7;
  string last_backup = 8;
  string registered_at = 9;
}

message ListClientsResponse {
  repeated ClientSummary clients = 1;
}

// GetClientStatusRequest asks for one client's detailed status (admin/server
// only, read-only).
message GetClientStatusRequest {
  string client_id = 1;
}

// MissedBackupDetail describes a single missed scheduled backup. scheduled_at
// is an RFC3339 string (UTC) or empty when unset.
message MissedBackupDetail {
  string level = 1;
  string scheduled_at = 2;
}

// ClientStatusResponse carries one client's full status, mirroring
// registry.ClientInfo. Timestamp fields are RFC3339 strings (UTC) or empty;
// last_backup is resolved server-side. found is false when the client is not
// registered.
message ClientStatusResponse {
  bool found = 1;
  string client_id = 2;
  string address = 3;
  string os_family = 4;
  string hostname = 5;
  string machine_id = 6;
  string status = 7;
  bool disabled = 8;
  bool watcher_active = 9;
  string last_seen = 10;
  string last_backup = 11;
  string registered_at = 12;
  bool has_schedule = 13;
  string full_backup_cron = 14;
  string auto_backup_cron = 15;
  int32 missed_backups = 16;
  repeated MissedBackupDetail missed_backup_details = 17;
}

// PushRestoreResponse is returned after a PushRestore client stream completes.
// The streamed request messages are FileChunk (see data.proto).
message PushRestoreResponse {
  bool success = 1;
  int64 files_received = 2;
  int64 bytes_total = 3;
  int64 files_failed = 4;
  string message = 5;
}

// --- CommandTunnel messages (NAT traversal) ---
// These mirror the hand-maintained Go in internal/grpc/proto/tunnel.go. The
// server pushes TunnelCommand down the bidirectional stream and the client
// replies with TunnelResponse on the same stream.

message TunnelCommand {
  string request_id = 1;
  PingRequest ping_request = 2;
  BackupRequest trigger_backup = 3;
  StopRequest stop_backup = 4;
  StatusRequest get_status = 5;
  WatcherRequest start_watcher = 6;
  WatcherRequest stop_watcher = 7;
  PushRestoreInitiateRequest push_restore_initiate = 8;
}

message TunnelResponse {
  string request_id = 1;
  string error = 2;
  PingResponse ping_response = 3;
  BackupResponse backup_response = 4;
  StopResponse stop_response = 5;
  StatusResponse status_response = 6;
  WatcherResponse watcher_response = 7;
  PushRestoreResponse push_restore_response = 8;
}

message TunnelRegistration {
  string client_id = 1;
}

message PushRestoreInitiateRequest {
  string dest_path = 1;
  string source_client = 2;
  int64 total_files = 3;
}
