{{template "header" .}}
<h1 class="text-lg font-bold p-4">Restore File Browser</h1>
<div class="bg-white rounded shadow p-4 m-4">
    <h2 class="font-bold mb-4">Search Files</h2>
    <p class="text-sm text-gray-600 mb-4">Search for files in your backups by name or path. Use the CLI for actual restore:<br>
        <code class="bg-gray-100 px-2 py-1 rounded text-sm">TERGUM_PASSPHRASE=... tergum restore "query" --dest /path</code>
    </p>
    <input type="text" name="query" placeholder="Search by filename or path (e.g. *.go, report.pdf, /home/user/Documents/)"
           class="border rounded px-3 py-2 w-full text-sm"
           hx-get="/api/restore/search" hx-trigger="keyup changed delay:400ms" hx-target="#search-results" hx-swap="innerHTML">
    <div id="search-results" class="mt-4">
        <p class="text-gray-500 italic text-sm">Type to search...</p>
    </div>
</div>
<div class="bg-white rounded shadow p-4 m-4">
    <h2 class="font-bold mb-4">Browse by Backup</h2>
    <div hx-get="/api/restore/backups" hx-trigger="load" hx-swap="innerHTML">
        <p class="text-gray-500 italic text-sm">Loading...</p>
    </div>
</div>
{{template "footer" .}}
