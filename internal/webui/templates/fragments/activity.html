{{define "content"}}
<div class="space-y-6" x-data="activityPage">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Activity Log</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Real-time console output and server diagnostic logs.</p>
        </div>
        <!-- Connection status & toast toggle -->
        <div class="flex items-center gap-4 bg-white dark:bg-gray-800 px-4 py-2 rounded-lg border border-gray-200 dark:border-gray-700 shadow-sm self-start md:self-auto">
            <!-- Toast notifications toggle -->
            <label class="flex items-center gap-2 cursor-pointer select-none">
                <span class="text-xs font-medium text-gray-600 dark:text-gray-300">Toasts</span>
                <button type="button"
                        @click="$store.app.toggleToasts()"
                        :class="$store.app.toastsEnabled ? 'bg-blue-500' : 'bg-gray-300 dark:bg-gray-600'"
                        class="relative inline-flex h-5 w-10 flex-shrink-0 rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                    <span :style="$store.app.toastsEnabled ? 'transform: translateX(1.25rem)' : 'transform: translateX(0)'"
                          class="pointer-events-none inline-block h-4 w-4 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out"></span>
                </button>
            </label>
            <div class="h-4 w-px bg-gray-200 dark:bg-gray-700"></div>
            <!-- Connection indicator -->
            <div class="flex items-center gap-2">
                <span class="relative flex h-2 w-2" x-show="connected">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                </span>
                <span class="relative flex h-2 w-2" x-show="!connected">
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-red-500"></span>
                </span>
                <span class="text-xs font-medium text-gray-500 dark:text-gray-400" x-text="connected ? 'Connected' : 'Disconnected'"></span>
            </div>
        </div>
    </div>

    <!-- Controls Bar -->
    <div class="flex flex-wrap items-center justify-between gap-4">
        <!-- Level Filters -->
        <div class="flex items-center bg-white dark:bg-gray-800 p-1 rounded-lg border border-gray-200 dark:border-gray-700 shadow-sm">
            <button @click="levelFilter = 'ALL'"
                    :class="levelFilter === 'ALL' ? 'bg-gray-100 dark:bg-gray-700 text-gray-900 dark:text-white font-semibold' : 'text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white'"
                    class="px-3 py-1 text-xs rounded-md transition-all">ALL</button>
            <button @click="levelFilter = 'INFO'"
                    :class="levelFilter === 'INFO' ? 'bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 font-semibold' : 'text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white'"
                    class="px-3 py-1 text-xs rounded-md transition-all">INFO</button>
            <button @click="levelFilter = 'WARN'"
                    :class="levelFilter === 'WARN' ? 'bg-amber-50 dark:bg-amber-900/30 text-amber-600 dark:text-amber-400 font-semibold' : 'text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white'"
                    class="px-3 py-1 text-xs rounded-md transition-all">WARN</button>
            <button @click="levelFilter = 'ERROR'"
                    :class="levelFilter === 'ERROR' ? 'bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400 font-semibold' : 'text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white'"
                    class="px-3 py-1 text-xs rounded-md transition-all">ERROR</button>
            <button @click="levelFilter = 'DEBUG'"
                    :class="levelFilter === 'DEBUG' ? 'bg-purple-50 dark:bg-purple-900/30 text-purple-600 dark:text-purple-400 font-semibold' : 'text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white'"
                    class="px-3 py-1 text-xs rounded-md transition-all">DEBUG</button>
        </div>

        <!-- Search input and utility buttons -->
        <div class="flex items-center gap-3 w-full sm:w-auto">
            <!-- Search bar -->
            <div class="relative flex-1 sm:flex-initial sm:w-64">
                <input type="text" x-model="searchQuery" placeholder="Filter console logs..."
                       class="w-full text-xs bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg pl-8 pr-8 py-2 focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 text-gray-700 dark:text-gray-300 shadow-sm">
                <div class="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none text-gray-400">
                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
                <button x-show="searchQuery" @click="searchQuery = ''" class="absolute inset-y-0 right-0 pr-2.5 flex items-center text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <!-- Action buttons -->
            <button @click="copyConsole" title="Copy to clipboard"
                    class="p-2 bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 border border-gray-200 dark:border-gray-700 rounded-lg text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white shadow-sm transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                </svg>
            </button>
            <button @click="clearConsole" title="Clear console"
                    class="p-2 bg-white dark:bg-gray-800 hover:bg-red-50 dark:hover:bg-red-950/20 border border-gray-200 dark:border-gray-700 hover:border-red-200 dark:hover:border-red-900/30 rounded-lg text-gray-600 dark:text-gray-400 hover:text-red-600 dark:hover:text-red-400 shadow-sm transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Terminal Board -->
    <div class="bg-gray-950 rounded-xl shadow-xl border border-gray-800 overflow-hidden flex flex-col h-[calc(100vh-270px)] min-h-[400px] relative">
        <!-- Terminal Header -->
        <div class="flex items-center justify-between px-4 py-3 bg-gray-900 border-b border-gray-800 select-none">
            <div class="flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-red-500"></span>
                <span class="w-3 h-3 rounded-full bg-yellow-500"></span>
                <span class="w-3 h-3 rounded-full bg-green-500"></span>
                <span class="ml-2 font-mono text-xs font-semibold text-gray-400">tergumd.log</span>
            </div>
            <div class="flex items-center gap-4">
                <label class="flex items-center gap-2 cursor-pointer text-xs font-mono text-gray-400 hover:text-gray-200 select-none">
                    <input type="checkbox" x-model="autoScroll" class="rounded bg-gray-800 border-gray-700 text-blue-500 focus:ring-0 focus:ring-offset-0 w-3.5 h-3.5">
                    Auto-scroll
                </label>
            </div>
        </div>

        <!-- Terminal Output -->
        <div class="flex-1 overflow-y-auto p-4 font-mono text-xs text-gray-300 space-y-1.5 scrollbar-thin scrollbar-thumb-gray-800" x-ref="logContainer">
            <!-- Loading indicator -->
            <template x-if="loading">
                <div class="space-y-2 py-2">
                    <div class="flex items-center gap-2 animate-pulse">
                        <span class="text-blue-500">[SYSTEM]</span>
                        <span class="h-3 bg-gray-800 rounded w-1/3"></span>
                    </div>
                    <div class="flex items-center gap-2 animate-pulse">
                        <span class="text-blue-500">[SYSTEM]</span>
                        <span class="h-3 bg-gray-800 rounded w-1/2"></span>
                    </div>
                </div>
            </template>

            <!-- Logs list -->
            <template x-for="log in filteredLogs" :key="log.id">
                <div class="py-0 px-2 break-all whitespace-pre-wrap hover:bg-gray-900/60 leading-normal font-mono transition-colors duration-100"
                     :style="{
                         color: log.level === 'ERROR' ? '#f87171' : 
                                log.level === 'WARN' ? '#fbbf24' : 
                                log.level === 'DEBUG' ? '#c084fc' : '#e5e7eb',
                         backgroundColor: log.level === 'ERROR' ? 'rgba(127, 29, 29, 0.15)' : 
                                         log.level === 'WARN' ? 'rgba(120, 53, 4, 0.1)' : 
                                         log.level === 'DEBUG' ? 'rgba(88, 28, 135, 0.1)' : 'transparent'
                     }"
                     x-text="log.message"></div>
            </template>

            <!-- Empty logs state -->
            <div x-show="!loading && filteredLogs.length === 0" class="text-gray-500 italic text-center py-20 font-mono text-sm select-none">
                No matching console output logs found.
            </div>
        </div>
    </div>
</div>
{{end}}
