{{define "content"}}
<div class="space-y-6">
    <!-- Connected Clients -->
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm p-6">
        <h2 class="text-base font-semibold text-gray-800 dark:text-gray-100 mb-4">Connected Clients</h2>
        <div id="clients-list" hx-get="/api/clients/list" hx-trigger="load, every 5s" hx-swap="innerHTML">
            <!-- Skeleton loader grid shown on initial load -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Skeleton client card 1 -->
                <div class="animate-pulse bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg p-4 space-y-3">
                    <div class="flex items-center justify-between">
                        <div class="h-5 w-32 bg-gray-200 dark:bg-gray-700 rounded"></div>
                        <div class="h-3 w-3 bg-gray-200 dark:bg-gray-700 rounded-full"></div>
                    </div>
                    <div class="space-y-2">
                        <div class="h-3 w-28 bg-gray-200 dark:bg-gray-700 rounded"></div>
                        <div class="h-3 w-36 bg-gray-200 dark:bg-gray-700 rounded"></div>
                        <div class="h-3 w-24 bg-gray-200 dark:bg-gray-700 rounded"></div>
                    </div>
                    <div class="flex gap-2 pt-2 border-t border-gray-100 dark:border-gray-700">
                        <div class="h-7 w-24 bg-gray-200 dark:bg-gray-700 rounded"></div>
                        <div class="h-7 w-24 bg-gray-200 dark:bg-gray-700 rounded"></div>
                        <div class="h-7 w-24 bg-gray-200 dark:bg-gray-700 rounded"></div>
                    </div>
                </div>
                <!-- Skeleton client card 2 -->
                <div class="animate-pulse bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg p-4 space-y-3">
                    <div class="flex items-center justify-between">
                        <div class="h-5 w-28 bg-gray-200 dark:bg-gray-700 rounded"></div>
                        <div class="h-3 w-3 bg-gray-200 dark:bg-gray-700 rounded-full"></div>
                    </div>
                    <div class="space-y-2">
                        <div class="h-3 w-32 bg-gray-200 dark:bg-gray-700 rounded"></div>
                        <div class="h-3 w-28 bg-gray-200 dark:bg-gray-700 rounded"></div>
                        <div class="h-3 w-20 bg-gray-200 dark:bg-gray-700 rounded"></div>
                    </div>
                    <div class="flex gap-2 pt-2 border-t border-gray-100 dark:border-gray-700">
                        <div class="h-7 w-24 bg-gray-200 dark:bg-gray-700 rounded"></div>
                        <div class="h-7 w-24 bg-gray-200 dark:bg-gray-700 rounded"></div>
                        <div class="h-7 w-24 bg-gray-200 dark:bg-gray-700 rounded"></div>
                    </div>
                </div>
                <!-- Skeleton client card 3 -->
                <div class="animate-pulse bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg p-4 space-y-3">
                    <div class="flex items-center justify-between">
                        <div class="h-5 w-36 bg-gray-200 dark:bg-gray-700 rounded"></div>
                        <div class="h-3 w-3 bg-gray-200 dark:bg-gray-700 rounded-full"></div>
                    </div>
                    <div class="space-y-2">
                        <div class="h-3 w-24 bg-gray-200 dark:bg-gray-700 rounded"></div>
                        <div class="h-3 w-32 bg-gray-200 dark:bg-gray-700 rounded"></div>
                        <div class="h-3 w-28 bg-gray-200 dark:bg-gray-700 rounded"></div>
                    </div>
                    <div class="flex gap-2 pt-2 border-t border-gray-100 dark:border-gray-700">
                        <div class="h-7 w-24 bg-gray-200 dark:bg-gray-700 rounded"></div>
                        <div class="h-7 w-24 bg-gray-200 dark:bg-gray-700 rounded"></div>
                        <div class="h-7 w-24 bg-gray-200 dark:bg-gray-700 rounded"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{{end}}
