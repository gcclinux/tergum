{{template "header" .}}
<h1 class="text-lg font-bold p-4">Dashboard</h1>
<div class="grid grid-cols-2 md:grid-cols-5 gap-4 m-4">
    <div class="bg-white rounded shadow p-4" hx-get="/api/system/cpu" hx-trigger="load, every 3s" hx-swap="innerHTML">
        <h2 class="text-xs text-gray-500 uppercase">CPU Load</h2>
        <p class="text-2xl font-bold mt-1">...</p>
    </div>
    <div class="bg-white rounded shadow p-4" hx-get="/api/system/memory" hx-trigger="load, every 3s" hx-swap="innerHTML">
        <h2 class="text-xs text-gray-500 uppercase">Memory</h2>
        <p class="text-2xl font-bold mt-1">...</p>
    </div>
    <div class="bg-white rounded shadow p-4">
        <h2 class="text-xs text-gray-500 uppercase">Backed Up Files</h2>
        <p class="text-2xl font-bold mt-1">{{.TotalFiles}}</p>
    </div>
    <div class="bg-white rounded shadow p-4">
        <h2 class="text-xs text-gray-500 uppercase">Storage Used</h2>
        <p class="text-2xl font-bold mt-1">{{.TotalSize}}</p>
    </div>
    <div class="bg-white rounded shadow p-4">
        <h2 class="text-xs text-gray-500 uppercase">Version</h2>
        <p class="text-2xl font-bold mt-1">{{.Version}}</p>
    </div>
</div>
{{template "footer" .}}
