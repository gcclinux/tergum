{{template "header" .}}
<h1 class="text-lg font-bold p-4">Dashboard</h1>
<div class="flex">
    <div class="bg-white rounded shadow p-4 m-4">
        <h2 class="font-bold">Server Status</h2>
        <p>Uptime: {{.Uptime}}</p>
        <p>Version: {{.Version}}</p>
    </div>
    <div class="bg-white rounded shadow p-4 m-4">
        <h2 class="font-bold">Storage</h2>
        <p>Total Files: {{.TotalFiles}}</p>
        <p>Total Size: {{.TotalSize}}</p>
    </div>
    <div class="bg-white rounded shadow p-4 m-4">
        <h2 class="font-bold">Connected Clients</h2>
        <p>Active: {{.ActiveClients}}</p>
    </div>
</div>
<div class="bg-white rounded shadow p-4 m-4">
    <h2 class="font-bold">Recent Activity</h2>
    <div hx-get="/api/activity/recent" hx-trigger="load" hx-swap="innerHTML">
        Loading...
    </div>
</div>
{{template "footer" .}}
